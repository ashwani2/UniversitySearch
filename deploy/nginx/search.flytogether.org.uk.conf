# Install:
#   sudo cp deploy/nginx/search.flytogether.org.uk.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/search.flytogether.org.uk.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then, once DNS resolves:
#   sudo certbot --nginx -d search.flytogether.org.uk

server {
    listen 80;
    listen [::]:80;
    server_name search.flytogether.org.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name search.flytogether.org.uk;

    ssl_certificate     /etc/letsencrypt/live/search.flytogether.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/search.flytogether.org.uk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # SOP generation calls an upstream LLM and falls back through several
    # providers, so a single request can legitimately run well past nginx's 60s
    # default. A 504 here would surface as "Could not generate the SOP".
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The LLM response is streamed; buffering it would delay the whole reply.
        proxy_buffering off;
    }
}
